services:
  # PostgreSQL for User Service
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init-user-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Event Service
  postgres-event:
    image: postgres:15-alpine
    container_name: postgres-event
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init-event-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Ticket Service
  postgres-ticket:
    image: postgres:15-alpine
    container_name: postgres-ticket
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_ticket_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init-ticket-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Order Service
  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init-order-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Payment Service
  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init-payment-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Notification Service
  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init-notification-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: user-service
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/user-service:/usr/src/app/apps/user-service
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

  # Event Service
  event-service:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
    container_name: event-service
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - EVENT_DATABASE_URL=${EVENT_DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres-event:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/event-service:/usr/src/app/apps/event-service
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

  # Ticket Service
  ticket-service:
    build:
      context: .
      dockerfile: apps/ticket-service/Dockerfile
    container_name: ticket-service
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - TICKET_DATABASE_URL=${TICKET_DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - RESERVATION_TIMEOUT_MINUTES=${RESERVATION_TIMEOUT_MINUTES:-15}
      - MAX_TICKETS_PER_USER=${MAX_TICKETS_PER_USER:-10}
      - LOW_STOCK_THRESHOLD=${LOW_STOCK_THRESHOLD:-10}
    depends_on:
      postgres-ticket:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/ticket-service:/usr/src/app/apps/ticket-service
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: order-service
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - ORDER_DATABASE_URL=${ORDER_DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - ORDER_TIMEOUT_MINUTES=${ORDER_TIMEOUT_MINUTES:-30}
      - MAX_CART_ITEMS=${MAX_CART_ITEMS:-20}
      - CART_EXPIRY_HOURS=${CART_EXPIRY_HOURS:-24}
      - SAGA_TIMEOUT_MINUTES=${SAGA_TIMEOUT_MINUTES:-10}
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/order-service:/usr/src/app/apps/order-service
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

  # Payment Service - NOW ENABLED
  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    container_name: payment-service
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${PAYMENT_DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      # Stripe Configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # M-Pesa Configuration
      - MPESA_BASE_URL=${MPESA_BASE_URL}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - MPESA_INITIATOR_NAME=${MPESA_INITIATOR_NAME}
      - MPESA_SECURITY_CREDENTIAL=${MPESA_SECURITY_CREDENTIAL}
      - MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL}
      # Flutterwave Configuration (ADDED)
      - FLUTTERWAVE_BASE_URL=${FLUTTERWAVE_BASE_URL}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - FLUTTERWAVE_ENCRYPTION_KEY=${FLUTTERWAVE_ENCRYPTION_KEY}
      - FLUTTERWAVE_REDIRECT_URL=${FLUTTERWAVE_REDIRECT_URL}
      - FLUTTERWAVE_WEBHOOK_URL=${FLUTTERWAVE_WEBHOOK_URL}
      - FLUTTERWAVE_WEBHOOK_SECRET=${FLUTTERWAVE_WEBHOOK_SECRET}
      # Payment Settings
      - PAYMENT_TIMEOUT_SECONDS=${PAYMENT_TIMEOUT_SECONDS:-30}
      - SUPPORTED_CURRENCIES=${SUPPORTED_CURRENCIES}
      - PLATFORM_FEE_PERCENTAGE=${PLATFORM_FEE_PERCENTAGE:-2.5}
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/payment-service:/usr/src/app/apps/payment-service
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

  # Notification Service - NOW ENABLED
  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: notification-service
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NOTIFICATION_DATABASE_URL=${NOTIFICATION_DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      # Brevo (Sendinblue) Configuration
      - BREVO_API_KEY=${BREVO_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      # SMS Configuration (Optional)
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      # Notification Settings
      - DAILY_EMAIL_LIMIT=${DAILY_EMAIL_LIMIT:-300}
      - NOTIFICATION_QUEUE_CONCURRENCY=${NOTIFICATION_QUEUE_CONCURRENCY:-10}
      - MAX_RETRY_ATTEMPTS=${MAX_RETRY_ATTEMPTS:-3}
      - RETRY_DELAY_SECONDS=${RETRY_DELAY_SECONDS:-60}
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/notification-service:/usr/src/app/apps/notification-service
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT:-3000}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-true}
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      ticket-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    volumes:
      - ./apps/api-gateway:/usr/src/app/apps/api-gateway
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

volumes:
  postgres_user_data:
  postgres_event_data:
  postgres_ticket_data:
  postgres_order_data:
  postgres_payment_data:
  postgres_notification_data:
  rabbitmq_data:
  redis_data:

networks:
  microservices:
    driver: bridge