      - REDIS_URL=${REDIS_URL}
      - ORDER_TIMEOUT_MINUTES=${ORDER_TIMEOUT_MINUTES:-30}
      - MAX_CART_ITEMS=${MAX_CART_ITEMS:-20}
      - CART_EXPIRY_HOURS=${CART_EXPIRY_HOURS:-24}
      - SAGA_TIMEOUT_MINUTES=${SAGA_TIMEOUT_MINUTES:-10}
