        condition: service_started
      user-service-2:
        condition: service_started
    volumes:
      - ./apps/api-gateway:/usr/src/app/apps/api-gateway
      - ./libs:/usr/src/app/libs
      - /usr/src/app/node_modules
    networks:
      - microservices

